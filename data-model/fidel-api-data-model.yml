entities:
  - name: Program
    description: A card-linked program that cards are linked to and that brands/locations participate in.
    id_field: id
  - name: Brand
    description: A merchant brand whose locations generate qualifying transactions.
    id_field: id
  - name: Location
    description: A physical/online location belonging to a brand and participating in a program.
    id_field: id
  - name: Card
    description: A tokenized payment card (Visa/Mastercard/Amex) linked to a program.
    id_field: id
    key_fields: [firstNumbers, lastNumbers, scheme, metadata]
  - name: Transaction
    description: A real-time auth/clearing/refund event captured on a linked card at a participating location.
    id_field: id
    key_fields: [auth, cleared, authCode, cardId, amount]
  - name: Offer
    description: A card-linked offer (cashback/reward) attached to a program/brand.
    id_field: id
  - name: Webhook
    description: A registered brand- or program-scoped HTTP endpoint receiving events.
    id_field: id
    alias: hook
  - name: MID
    description: A Merchant ID mapping used to attribute transactions to brands/locations.
