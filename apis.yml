aid: fidel-api
name: FIDEL API
description: >-
  Fidel API is a global card-linking platform that connects Visa, Mastercard and
  Amex payment cards to web and mobile applications through a single API. Once a
  cardholder links a card (via Fidel's PCI-compliant Web, iOS, Android or React
  Native SDKs), Fidel streams enriched, real-time transaction data - authorization,
  clearing and refund events - from the card networks to the developer's server via
  signed webhooks. Developers use it to build card-linked loyalty, rewards, cashback
  and offers programs without handling raw card data or PCI scope. The platform
  spans Programs, Brands, Locations, Cards, Transactions, Offers and Merchant IDs,
  operates test and live environments, and is available across the US, UK, Ireland,
  Canada, Sweden and the UAE (with Japan in beta). Founded in 2018 and headquartered
  in London, Fidel is backed by Bain Capital Ventures.
